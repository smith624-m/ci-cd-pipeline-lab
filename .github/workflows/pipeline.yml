name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Run unit tests
      run: python -m unittest discover

    - name: Build Docker image
      run: docker build -t cicd-pipeline-demo .

    - name: Test Docker container
      run: docker run cicd-pipeline-demo

    - name: Deploy step
      run: echo "Simulated deployment completed successfully."
